name: CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: ./itemmanage
        run: ./mvnw test

  build-backend:
    runs-on: ubuntu-latest

    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t itemmanage-backend ./itemmanage

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build --build-arg VITE_API_URL=/api -t itemmanage-frontend ./itemmanage-frontend