services:
  mongo:
    image: mongo:8.0
    container_name: itemmanage-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itemmanage-network

  mongo-init:
    image: mongo:8.0
    container_name: itemmanage-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo --quiet --eval "
        try {
          rs.status();
          print('Replica set déjà initialisé, rien à faire.');
        } catch (e) {
          print('Initialisation du replica set rs0...');
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          });
        }
      "
    networks:
      - itemmanage-network

  backend:
    build:
      context: ./itemmanage
      dockerfile: Dockerfile
    container_name: itemmanage-backend
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: ${ITEM_MONGODB_URI}
      ITEM_FRONTEND_URL: ${ITEM_FRONTEND_URL}
    ports:
      - "8080:8080"
    networks:
      - itemmanage-network

  frontend:
    build:
      context: ./itemmanage-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: itemmanage-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - itemmanage-network

volumes:
  mongo-data:

networks:
  itemmanage-network:
    driver: bridge